# Mosquitto MQTT broker — VehicleLogger
# Один TLS-listener на порту 8883 для устройств и backend.
# Анонимные соединения запрещены; пользователи и ACL — в отдельных файлах.

listener 8883
protocol mqtt

# TLS — сертификат от Let's Encrypt (wildcard *.nonconf.ru уже выпущен для веба)
cafile   /etc/ssl/letsencrypt/isrgrootx1.pem
certfile /etc/letsencrypt/live/nonconf.ru/fullchain.pem
keyfile  /etc/letsencrypt/live/nonconf.ru/privkey.pem

# Только аутентифицированные клиенты
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file      /etc/mosquitto/acl

# Сохранять сессии устройств между перезапусками (для QoS-1 ретраев)
persistence true
persistence_location /var/lib/mosquitto/

# Время жизни хранящихся PUBLISH-сообщений в офлайне
persistent_client_expiration 24h
max_queued_messages 1000

# Логи
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice