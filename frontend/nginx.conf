server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой неизвестный путь отдаём в index.html,
    # иначе vue-router (history mode) ломается при перезагрузке страницы.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API проксируется в контейнер бэкенда.
    # location /api/ + proxy_pass без пути → URI сохраняется как есть:
    #   /api/vehicles  →  http://backend:8080/api/vehicles
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # ИИ-сводка может отвечать долго
    }
}
